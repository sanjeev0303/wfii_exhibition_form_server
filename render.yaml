# Render Blueprint for WFII Exhibition Form Server

services:
  # Web Service (API Server)
  - type: web
    name: wfii-exhibition-server
    runtime: node
    region: oregon  # Change to your preferred region
    plan: free  # Change to 'starter' or higher for production
    branch: main
    buildCommand: pnpm install --frozen-lockfile
    startCommand: pnpm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: exhibition-db
          property: connectionString
      - key: IMAGEKIT_PRIVATE_KEY
        sync: false  # Set manually in Render dashboard
      - key: IMAGEKIT_PUBLIC_KEY
        sync: false
      - key: IMAGEKIT_URL_ENDPOINT
        sync: false
      - key: IMAGEKIT_ID
        sync: false

databases:
  # PostgreSQL Database
  - name: exhibition-db
    databaseName: exhibitions
    user: exhibitions_user
    plan: free  # Change to 'starter' or higher for production
    region: oregon  # Should match web service region
